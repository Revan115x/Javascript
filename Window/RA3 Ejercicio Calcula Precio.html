<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Posada San Antonio</title>
    <link rel="stylesheet" href="main.css">
    <script>
        function calcular() {
            let individuales = Number(document.getElementById("sel1").value);
            let dobles = Number(document.getElementById("sel2").value);

            let precioIndividuales = individuales * 90;
            let precioDobles = dobles * 120;
            let total = precioIndividuales + precioDobles;

            let web = window.open("", "precio", "width=400,height=300,left=700,top=100");

            web.document.write("<h2>Posada San Antonio</h2>");
            web.document.write("<p>Habitaciones individuales: " + individuales + " x 90€ = " + precioIndividuales + "€</p>");
            web.document.write("<p>Habitaciones dobles: " + dobles + " x 120€ = " + precioDobles + "€</p>");
            web.document.write("<h3>Precio total por una noche: " + total + "€</h3>");
            web.document.write("<input type='button' value='Cerrar' onclick='window.close()'>");
        }
        function pedir() {
            let telefonoTxt = document.getElementById("telefono").value;
            if (telefonoTxt == "") {
                alert("RELLENA EL CAMPO TELEFONO");
                document.getElementById("telefono").focus();
                return;
            }

            if (telefonoTxt.length != 9) {
                alert("RELLENA EL CAMPO TELEFONO CON 9 DIGITOS");
                document.getElementById("telefono").focus();
                return;
            }

            let telefono = Number(telefonoTxt);

            if (isNaN(telefono)) {
                alert("RELLENA EL CAMPO TELEFONO CON NUMEROS");
                document.getElementById("telefono").focus();
                return;
            }

            Confirmar = confirm("CONFIRMA SI QUIERE QUE NOS CONTACTEMOS CON USTED");
            let web

            if (Confirmar) {
                /*abre la ventana inmediatamente.*/
                web = window.open("", "telefono", "width=400,height=200,left=700,top=100");
                web.document.write("<p>NOS PONDREMOS EN CONTACTO CON USTED</p>"); /*escribe el mensaje en esa ventana.*/

                /*espera 5000 milisegundos (5 segundos).*/
                /*cierra esa ventana concreta, porque web guarda su referencia.*/
                setTimeout(function () {
                    web.close();
                }, 5000);

            } else {
                alert("Te esperamos en otra ocasión")
                window.location.href = "www.acierto.com";
                window.location.href = "www.santalucia.es";
            }
        }  
    </script>
</head>

<body>
    Actualmente nuestros precios por habitación y noche son (Iva incluido):

    <!--Al pulsar el botón CALCULAR PRECIO se calcula el precio para una noche dependiendo
del número de habitaciones seleccionadas. Se abre una ventana en la que aparece el
desglose del precio para la estancia y un botón para cerrar esa ventana.-->

    <ul>
        <li>Habitación individual 90€ <br>
            <span id="id50">Seleccione cuantas
                <select id="sel1">
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                </select>
            </span>
        </li>
        <li>Habitación doble 120€ <br>
            <span id="id70">Seleccione cuantas
                <select id="sel2">
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                </select>
            </span>
        </li>
    </ul>
    <input type="button" value="CALCULAR PRECIO" onclick="calcular()"> <br><br>
    <br>
    Si nos deja un teléfono nosotros le llamamos
    <input type="text" id="telefono">
    <input type="button" id="idpet" value="Más información" onclick="pedir()">
</body>

</html>
