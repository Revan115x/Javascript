<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de Expresiones Regulares ✨ Hachiware</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #c0e0ff;
            --card-bg: rgba(255, 255, 255, 0.72);
            --primary-color: #4b8df8;
            --primary-hover: #3172e0;
            --accent-blue: #a0cafe;
            --text-color: #243853;
            --border-color: rgba(255, 255, 255, 0.8);
            --shadow: 0 20px 40px rgba(75, 141, 248, 0.25);
            --valid-color: #1e8751;
            --valid-bg: rgba(212, 248, 226, 0.9);
            --invalid-color: #d93849;
            --invalid-bg: rgba(255, 218, 223, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;

            background-image:
                radial-gradient(circle at 15% 15%, rgba(255, 255, 255, 0.9) 0%, transparent 25%),
                radial-gradient(circle at 85% 85%, rgba(255, 255, 255, 0.8) 0%, transparent 30%),
                url("data:image/svg+xml,%3Csvg xmlns='https://i.pinimg.com/1200x/9b/f2/96/9bf296f8cbecd81bbca46d86454a9e6b.jpg' width='220' height='260'");
            background-attachment: fixed;
        }


        .container {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            padding: 45px 50px;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(71, 132, 226, 0.3), inset 0 0 0 2px rgba(255, 255, 255, 0.9);
            width: 100%;
            max-width: 840px;
            position: relative;
            z-index: 2;
        }

        .header-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin-bottom: 32px;
        }

        h1 {
            color: #2b5cb0;
            font-size: 2.2rem;
            font-weight: 800;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.8);
            letter-spacing: -0.5px;
        }

        .header-icon {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(75, 141, 248, 0.25), inset 0 0 0 3px rgba(255, 255, 255, 0.9);
            overflow: hidden;
            flex-shrink: 0;
        }

        .form-group {
            margin-bottom: 22px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.95rem;
            font-weight: 700;
            color: #2c446e;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-row {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .input-wrapper {
            flex: 1;
            min-width: 230px;
            position: relative;
        }

        input {
            width: 100%;
            padding: 13px 18px;
            border: 2px solid rgba(180, 212, 255, 0.8);
            border-radius: 16px;
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text-color);
            outline: none;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.03);
        }

        input:focus {
            border-color: var(--primary-color);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(91, 155, 243, 0.25), 0 4px 12px rgba(91, 155, 243, 0.15);
            transform: translateY(-1px);
        }

        input::placeholder {
            color: #8daedc;
        }

        .btn-check {
            background: linear-gradient(135deg, #5b9bf3 0%, #3a7bd5 100%);
            color: white;
            border: 1.5px solid rgba(255, 255, 255, 0.6);
            padding: 13px 24px;
            border-radius: 16px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 6px 16px rgba(58, 123, 213, 0.35);
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-check:hover {
            background: linear-gradient(135deg, #4a8be2 0%, #296ac4 100%);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 22px rgba(58, 123, 213, 0.45);
        }

        .btn-check:active {
            transform: translateY(0) scale(0.98);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 9px 16px;
            border-radius: 14px;
            font-size: 0.88rem;
            font-weight: 800;
            min-width: 110px;
            text-align: center;
            opacity: 0;
            transform: scale(0.85);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(8px);
        }

        .badge.visible {
            opacity: 1;
            transform: scale(1);
        }

        .badge.valid {
            background-color: var(--valid-bg);
            color: var(--valid-color);
            border: 2px solid #8be4af;
            box-shadow: 0 4px 14px rgba(30, 135, 81, 0.2);
        }

        .badge.invalid {
            background-color: var(--invalid-bg);
            color: var(--invalid-color);
            border: 2px solid #f7a2ab;
            box-shadow: 0 4px 14px rgba(217, 56, 73, 0.2);
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
                border-radius: 24px;
            }

            .header-title {
                flex-direction: column;
                text-align: center;
            }

            .input-row {
                flex-direction: column;
                align-items: stretch;
            }

            .btn-check,
            .badge {
                width: 100%;
            }

            h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header-title">
            <img class="header-icon" src="https://i.pinimg.com/736x/49/a8/a1/49a8a16aecdb6e11b542d9488013ce52.jpg"
                alt="Hachiware">
            <h1>Validación Regex 💙</h1>
        </div>

        <form id="formValidacion" autocomplete="off">
            <!-- a. Número binario -->
            <div class="form-group">
                <label for="binario">a. Número binario</label>
                <div class="input-row">
                    <div class="input-wrapper">
                        <input type="text" id="binario" placeholder="Ej: 10101101">
                    </div>
                    <button type="button" class="btn-check" onclick="validarCampo('binario', /^[01]+$/)">Comprobar
                        ✨</button>
                    <span id="badge-binario" class="badge"></span>
                </div>
            </div>

            <!-- b. Teléfono móvil -->
            <div class="form-group">
                <label for="movil">b. Teléfono móvil</label>
                <div class="input-row">
                    <div class="input-wrapper">
                        <input type="text" id="movil" placeholder="Ej: 612345678 o 712345678">
                    </div>
                    <button type="button" class="btn-check" onclick="validarCampo('movil', /^[67]\d{8}$/)">Comprobar
                        ✨</button>
                    <span id="badge-movil" class="badge"></span>
                </div>
            </div>

            <!-- c. Teléfono 901, 902 o 903 -->
            <div class="form-group">
                <label for="telefonoEspecial">c. Teléfono (901, 902 o 903)</label>
                <div class="input-row">
                    <div class="input-wrapper">
                        <input type="text" id="telefonoEspecial" placeholder="Ej: 901123456">
                    </div>
                    <button type="button" class="btn-check"
                        onclick="validarCampo('telefonoEspecial', /^90[123]\d{6}$/)">Comprobar ✨</button>
                    <span id="badge-telefonoEspecial" class="badge"></span>
                </div>
            </div>

            <!-- d. Curso -->
            <div class="form-group">
                <label for="curso">d. Curso (daw1, daw2, asir1, asir2, fin1 o fin2)</label>
                <div class="input-row">
                    <div class="input-wrapper">
                        <input type="text" id="curso" placeholder="Ej: daw1, ASIR2, Fin1">
                    </div>
                    <button type="button" class="btn-check"
                        onclick="validarCampo('curso', /^(daw1|daw2|asir1|asir2|fin1|fin2)$/i)">Comprobar ✨</button>
                    <span id="badge-curso" class="badge"></span>
                </div>
            </div>

            <!-- e. Cantidad de dinero -->
            <div class="form-group">
                <label for="dinero">e. Cantidad de dinero (dos decimales con , y € o $)</label>
                <div class="input-row">
                    <div class="input-wrapper">
                        <input type="text" id="dinero" placeholder="Ej: 12,50€ o 100,00$">
                    </div>
                    <button type="button" class="btn-check"
                        onclick="validarCampo('dinero', /^\d+,\d{2}[$€]$/)">Comprobar ✨</button>
                    <span id="badge-dinero" class="badge"></span>
                </div>
            </div>

            <!-- f. Página web -->
            <div class="form-group">
                <label for="web">f. Página web (www. + contiene poker/porno/juego + .com/.org/.es)</label>
                <div class="input-row">
                    <div class="input-wrapper">
                        <input type="text" id="web" placeholder="Ej: www.poker.com">
                    </div>
                    <button type="button" class="btn-check"
                        onclick="validarCampo('web', /^www\.(.*(poker|porno|juego).*)\.(com|org|es)$/i)">Comprobar
                        ✨</button>
                    <span id="badge-web" class="badge"></span>
                </div>
            </div>

            <!-- g. Hora -->
            <div class="form-group">
                <label for="hora">g. Hora (hh:mm:ss)</label>
                <div class="input-row">
                    <div class="input-wrapper">
                        <input type="text" id="hora" placeholder="Ej: 12:44:21">
                    </div>
                    <button type="button" class="btn-check"
                        onclick="validarCampo('hora', /^(0[0-9]|1[0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$/)">Comprobar
                        ✨</button>
                    <span id="badge-hora" class="badge"></span>
                </div>
            </div>

            <!-- h. Fecha -->
            <div class="form-group">
                <label for="fecha">h. Fecha (dd/mm/aaaa)</label>
                <div class="input-row">
                    <div class="input-wrapper">
                        <input type="text" id="fecha" placeholder="Ej: 22/10/2026">
                    </div>
                    <button type="button" class="btn-check"
                        onclick="validarCampo('fecha', /^(0[1-9]|[12][0-9]|3[01])\/(0[1-9]|1[0-2])\/\d{4}$/)">Comprobar
                        ✨</button>
                    <span id="badge-fecha" class="badge"></span>
                </div>
            </div>

            <!-- i. Contraseña de 6 dígitos -->
            <div class="form-group">
                <label for="pass6Digitos">i. Contraseña (6 dígitos exactos)</label>
                <div class="input-row">
                    <div class="input-wrapper">
                        <input type="password" id="pass6Digitos" placeholder="••••••">
                    </div>
                    <button type="button" class="btn-check" onclick="validarCampo('pass6Digitos', /^\d{6}$/)">Comprobar
                        ✨</button>
                    <span id="badge-pass6Digitos" class="badge"></span>
                </div>
            </div>

            <!-- j. Contraseña de 6 caracteres -->
            <div class="form-group">
                <label for="pass6Alfanumerica">j. Contraseña (6 car.: solo dígitos y/o minúsculas)</label>
                <div class="input-row">
                    <div class="input-wrapper">
                        <input type="password" id="pass6Alfanumerica" placeholder="••••••">
                    </div>
                    <button type="button" class="btn-check"
                        onclick="validarCampo('pass6Alfanumerica', /^[a-z0-9]{6}$/)">Comprobar ✨</button>
                    <span id="badge-pass6Alfanumerica" class="badge"></span>
                </div>
            </div>

            <!-- k. Contraseña 6 a 8 caracteres -->
            <div class="form-group">
                <label for="passCompleja">k. Contraseña (6-8 car.: min. 1 minúscula y 1 dígito)</label>
                <div class="input-row">
                    <div class="input-wrapper">
                        <input type="password" id="passCompleja" placeholder="••••••••">
                    </div>
                    <button type="button" class="btn-check"
                        onclick="validarCampo('passCompleja', /^(?=.*[a-z])(?=.*\d)[a-z0-9]{6,8}$/)">Comprobar
                        ✨</button>
                    <span id="badge-passCompleja" class="badge"></span>
                </div>
            </div>
        </form>
    </div>

    <script>
        function validarCampo(idInput, regex) {
            const input = document.getElementById(idInput);
            const badge = document.getElementById(`badge-${idInput}`);
            const valor = input.value.trim();

            if (valor === "") {
                badge.textContent = "Vacío";
                badge.className = "badge invalid visible";
                return;
            }

            const esValido = regex.test(valor);

            if (esValido) {
                badge.textContent = "✓ Válido";
                badge.className = "badge valid visible";
            } else {
                badge.textContent = "✕ No Válido";
                badge.className = "badge invalid visible";
            }
        }
    </script>
</body>

</html>
