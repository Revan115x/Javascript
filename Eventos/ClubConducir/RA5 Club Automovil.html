<!DOCTYPE html>
<html>

<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<style>
		span {
			display: none;
		}

		legend {
			color: #CC0033;
			font-weight: 600;
		}

		#precio {
			color: #222;
			font-weight: 600;
			line-height: 1.3;
		}
	</style>

	<script src="Club.js" defer></script>
</head>

<body>
	<h1>CLUB DEL AUTOMOVIL</h1>
	<h3>ALTA NUEVO SOCIO</h3>
	<form>
		<div>
			<fieldset>

				<legend>DATOS SOCIO</legend>

				Nombre &nbsp;&nbsp;<input type="text" id="nom" size=30 onfocus="cambiarColor(this)" onchange="validarNomApel(this)"><br><br>

				Apellidos <input type="text" id="ape" size=30 onfocus="cambiarColor(this)"onchange="validarNomApel(this)">

				<br><br>Fecha Nacimiento <input type="date" id=fecnac size=13 onfocus="cambiarColor(this)"onchange="if (validarFecha(this)) calcularEdad(this) ">

				Edad <input type="text" size=4 id="edad" readonly>

			</fieldset>

			<br>

			<fieldset>

				<legend>DATOS CARNET CONDUCIR </legend>

				Num Carnet <input type="text" id="carnet" size="15" onfocus="cambiarColor(this)" onchange="validarDNI(this)">

				Desde <input type="date" size=13 id="desde" onfocus="cambiarColor(this)" onchange="if (validarFecha(this)) calcularRenovar(this)">

				Renovar <input type="text" size=13 id="renovar" readonly>

				<input type="button" value="CONTRATAR" onclick="validar()">

				<br><br>

			</fieldset>

		</div>

	</form>
	<br>
	<div id="todoOK"></div>
</body>

</html>
