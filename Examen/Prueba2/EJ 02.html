<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>EXAMEN EJERCICIO 2 (RA5/RA6)</title>
    <link rel="stylesheet" href="main.css">
    <script src="script.js" defer></script>

    <style>
        span {
            display: none;
        }

        #precio {
            color: #222;
            font-weight: 600;
            line-height: 1.3;
        }

        .verde {
            color: rgb(81, 132, 69);
        }
    </style>
</head>

<body>
    <h1>CLUB JUVENIL PLAZA</h1>
    <img src="SALESIANAS.jpg" width="30%" height="30%">
    <h2>Formulario de inscripción para Actividades Extraescolares</h2>

    Nombre y Apellidos <input type="text" id="nom" size="20" onmouseover="agrandar(this)"  onmouseout="anular(this)"> <br><br>

    Edad al finalizar el año <input type="text" id="edad" size="10" readonly><br> <br>

    DNI <input type="text" id="dni" size="12"> 
    DNI Tutor <input type="text" id="dniT" size="12">
    Teléfono <input type="text" id="telefono" size="12" placeholder="999 99 99 99"  onmouseover="agrandar(this)"  onmouseout="anular(this)">
    <br><br>
    <div>
        <input type="checkbox"> Familia numerosa <br>
        <input type="radio" name="a"> NO Soy alumno del cole
        <input type="radio" name="a"> Soy alumno del cole con
        código <input type="text" id="cod"> <br><br>
        Seleccione una de las actividades:
        <select id="sel">
            <option value=20>Yoga 20€</option>
            <option value=30>Teatro 30€</option>
            <option value=20>Futbol 20€</option>
            <option value=20>Baloncesto 20€</option>
            <option value=10>Ajedrez 10€</option>
            <option value=25>Pintura 25€</option>
        </select>
        <input type="button" id="b1" value="Añadir Actividad" onclick="anadir()" >
        <input type="button" id="b2" value="CALCULAR PRECIO" onclick="calcular2()"> <br>
        <hr>
        <div id="info">
        </div>
    </div>
</body>

</html>
