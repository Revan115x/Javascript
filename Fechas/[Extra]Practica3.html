<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formularios de fechas</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      color: #333;
      margin: 0;
      padding: 30px;
    }

    .contenedor {
      max-width: 700px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 30px;
    }

    .formulario {
      background-color: white;
      padding: 25px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    h2 {
      color: #3498db;
      font-size: 20px;
      margin-top: 0;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
      margin-right: 8px;
      margin-bottom: 10px;
    }

    input:focus {
      outline: none;
      border-color: #3498db;
      box-shadow: 0 0 4px rgba(52, 152, 219, 0.3);
    }

    button {
      background-color: #3498db;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background-color: #2980b9;
    }

    .campos-fecha {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .campos-fecha input {
      width: 90px;
    }

    .descripcion {
      color: #777;
      margin-top: -10px;
      margin-bottom: 15px;
      font-size: 14px;
    }
  </style>
  <script>
    /*Muestra un mensaje de error si pulsan el botón sin haber seleccionado ninguna fecha*/
    function fecha_01() {
      let fechaTxt = document.getElementById("fecha").value;

      if (fechaTxt == "") {
        alert("Rellena el Campo Fecha")
      }

      let fechaActual = new Date();
      let fechaSeleccionada = new Date(fechaTxt);

      /*diferencia devuelta en milisegundos*/
      let diferencia = fechaActual - fechaSeleccionada;
      /*Diferencia de dias se multiplica por 1000 * 60 * 60 * 24 para convertir de milisegundos a días */
      let diasDiferencia = Math.floor(diferencia / (1000 * 60 * 60 * 24));

      alert("Han pasado " + diasDiferencia + " días desde la fecha seleccionada.");
    }

    function fecha_02() {
      let diaTxt = document.getElementById("dia").value;
      let mesTxt = document.getElementById("mes").value;
      let anioTxt = document.getElementById("anio").value;

      if (diaTxt == "" || mesTxt == "" || anioTxt == "") {
        alert("Rellena todos los campos de la fecha")
      }

      if (diaTxt < 1 || diaTxt > 31) {
        alert("El día debe estar entre 1 y 31")
      }
      if (mesTxt < 1 || mesTxt > 12) {
        alert("El mes debe estar entre 1 y 12")
      }
      if (anioTxt < 1900 || anioTxt > 2100) {
        alert("El año debe estar entre 1900 y 2100")
      }

      let fechaNacimiento = new Date(anioTxt, mesTxt - 1, diaTxt);
      let fechaActual = new Date();

      if (fechaNacimiento > fechaActual) {
        alert("La fecha de nacimiento no puede ser mayor que la fecha actual");
        return;
      }

      
      let edad = fechaActual.getFullYear() - fechaNacimiento.getFullYear();
      /*Verifica si el cumpleaños ya ha pasado este año*/
      if (fechaNacimiento.getMonth() > fechaActual.getMonth() || (fechaNacimiento.getMonth() === fechaActual.getMonth() && fechaNacimiento.getDate() > fechaActual.getDate())) {
        edad--;
      }

      alert("La edad de esta persona es: " + edad + " años");
    }
    function fecha_03() {
      let mesAnioTxt = document.getElementById("mesAnio").value;

      if (mesAnioTxt == "") {
        alert("Rellena el Campo Fecha")
      }

      let partes = mesAnioTxt.split("/");
      if (partes.length !== 2) {
        alert("Formato incorrecto. Debe ser mm/yyyy");
        return;
      }

      let mes = parseInt(partes[0], 10);
      let anio = parseInt(partes[1], 10);

      if (isNaN(mes) || isNaN(anio) || mes < 1 || mes > 12 || anio < 1900 || anio > 2100) {
        alert("Fecha inválida. Asegúrate de que el mes esté entre 1 y 12 y el año entre 1900 y 2100.");
        return;
      }

      let fechaInicio = new Date(anio, mes - 1, 1);
      let fechaActual = new Date();

      if (fechaInicio > fechaActual) {
        alert("La fecha de inicio no puede ser mayor que la fecha actual");
        return;
      }

      let diferenciaAnios = fechaActual.getFullYear() - fechaInicio.getFullYear();
      let diferenciaMeses = fechaActual.getMonth() - fechaInicio.getMonth();

      if (diferenciaMeses < 0) {
        diferenciaAnios--;
        diferenciaMeses += 12;
      }

      let trienios = Math.floor(diferenciaAnios / 3);

      alert("La persona ha trabajado " + trienios + " trienios en la empresa.");
    }
  </script>
</head>

<body>

  <div class="contenedor">

    <h1>Ejercicios con fechas</h1>

    <!-- Formulario 1 -->
    <div class="formulario">
      <h2>1. Fecha</h2>

      <p class="descripcion">
        Introduce una fecha utilizando el selector.
      </p>

      <form>
        <label for="fecha">Fecha:</label>
        <input type="date" id="fecha" name="fecha">

        <button type="button" onclick="fecha_01()">Días faltan o han pasado</button>
      </form>
    </div>


    <!-- Formulario 2 -->
    <div class="formulario">
      <h2>2. Día, mes y año</h2>

      <p class="descripcion">
        Introduce la fecha de nacimiento.
      </p>

      <form>
        <div class="campos-fecha">

          <div>
            <label for="dia">Día:</label>
            <input type="number" id="dia" name="dia" min="1" max="31">
          </div>

          <div>
            <label for="mes">Mes:</label>
            <input type="number" id="mes" name="mes" min="1" max="12">
          </div>

          <div>
            <label for="anio">Año:</label>
            <input type="number" id="anio" name="anio" min="1900" max="2100">
          </div>

        </div>

        <button type="button" onclick="fecha_02()">Muestra la edad de esta persona</button>
      </form>
    </div>


    <!-- Formulario 3 -->
    <div class="formulario">
      <h2>3. Mes y año</h2>

      <p class="descripcion">
        Introduce la fecha como una cadena con el formato mm/yyyy.
      </p>

      <form>
        <label for="mesAnio">Fecha:</label>
        <input type="text" id="mesAnio" name="mesAnio" placeholder="mm/yyyy">

        <button type="button" onclick="fecha_03()">Trienios en la empresa</button>
      </form>
    </div>
  </div>
  </div>

</body>

</html>
