//Mostrar cuantos días han pasado entre el día 23/08/2024 y hoy.

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>

        let fecha = new Date(2024,7,23);
        let fechaActual = new Date();

        let milisegFecha = fecha.getTime();
        let milisegActual = fechaActual.getTime();

        let diferencia = milisegActual - milisegFecha;

        let Segundos = diferencia / 1000;
        let Minutos = Segundos / 60 ;
        let Horas = Minutos / 60 ;
        let Dias = Horas / 24 ;

        /*let Dias = diferencia / (1000 * 60 * 60 * 24);*/

        alert("Han Pasado "+Math.floor(Dias));

    </script>
    
</body>
</html>
