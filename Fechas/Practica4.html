/*Pedir al usuario que teclee su nombre y mostrarle cuantos segundos ha tardado en
escribirlo.*/

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        let Inicio = new Date();
        let nombre = prompt("DIME TU NOMBRE")
        let fin = new Date();

        let tiempo = fin.getTime() - Inicio.getTime();

        let segundos = tiempo / 1000 ; 

        alert("Tardaste "+segundos+" Segundos")

    </script>
</body>
</html>
